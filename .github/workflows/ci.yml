name: deterministic-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned minimal dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run CI-equivalent verification
        run: python3 run.py
